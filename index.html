<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Forge</title>
<style>
:root{--bg:#0E0E10;--s1:#1B1B1E;--s2:#262024;--ac:#FF5630;--ac2:#FF8A3D;--am:#FFB020;--ok:#3DD68C;--t1:#fff;--t2:rgba(255,255,255,.58);--t3:rgba(255,255,255,.38);--ln:rgba(255,255,255,.08);--ink:#2A0E04;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--t1);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;font-size:16px;color:var(--t1);background:var(--s1);border:1px solid transparent;border-radius:12px;padding:12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:rgba(255,138,61,.6)}
textarea{resize:none;min-height:64px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ac2) 50%),linear-gradient(135deg,var(--ac2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.3}
svg{display:block}
.scr{padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 100px);max-width:560px;margin:0 auto}
h1{font-size:30px;font-weight:700;margin:4px 0;letter-spacing:-.4px}
.sub{color:var(--t2);font-size:14px}
.cap{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--t3)}
.card{background:var(--s1);border-radius:16px;padding:14px;display:block}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amber{color:var(--am)}.muted{color:var(--t2)}.faint{color:var(--t3)}.soft{color:var(--ac2)}.okc{color:var(--ok)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:14px;font-weight:600;background:var(--s1);width:100%;text-align:center}
.btn.pri{background:var(--ac);color:var(--ink)}
.btn.ok{background:var(--ok);color:#04342C}
.btn.ghost{background:var(--s2);color:var(--ac2)}
.btn.danger{background:rgba(226,75,74,.15);color:#FF6B6B}
.btn.sm{padding:10px;font-size:14px;border-radius:12px}
.btn:active,.pad button:active,.chip:active,.card:active{filter:brightness(1.3)}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:40px;margin-bottom:6px}
.navbtn{min-width:40px;height:40px;border-radius:20px;background:var(--s1);display:flex;align-items:center;justify-content:center;font-size:15px;padding:0 12px;color:var(--t1);font-weight:600}
.navbtn.ac{color:var(--ac)}
.navbtn svg{width:20px;height:20px}
.tabbar{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(var(--sb) + 8px);background:rgba(14,14,16,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--ln);display:flex;justify-content:space-around;z-index:10}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--t3);padding:4px 4px;min-width:58px}
.tab.on{color:var(--ac)}
.tab svg{width:24px;height:24px}
.resume-bar{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 74px);background:var(--ac);color:var(--ink);border-radius:14px;padding:12px 14px;font-weight:700;z-index:9;max-width:536px;margin:0 auto;text-align:center}
.hero{border-radius:20px;padding:16px;background:linear-gradient(135deg,#FF5630,#FF8A3D);color:var(--ink)}
.hero .cap{color:#4A1B0C;font-weight:700}
.hero h2{margin:4px 0 12px;font-size:21px}
.hero .btn{background:var(--bg);color:var(--t1);justify-content:space-between}
.hero .links{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;font-weight:700}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.metric .v{font-size:24px;font-weight:700;margin-top:3px}
.metric .u{font-size:13px;color:var(--t2);font-weight:400;margin-left:4px}
.chev{color:var(--t3);font-size:20px}
.sticky-cta{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 72px);padding:0 16px;z-index:9;max-width:560px;margin:0 auto}
.wk{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(var(--st) + 4px) 0 calc(var(--sb) + 8px);max-width:560px;margin:0 auto}
.wk-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 16px}
.wk-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 16px 8px}
.bars{display:flex;gap:3px;margin-top:8px}
.bars button{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
.bars button.part{background:rgba(255,86,48,.45)}
.bars button.done{background:var(--ac)}
.bars button.cur{background:var(--ac2);box-shadow:0 0 0 1.5px rgba(255,138,61,.5)}
.sethead,.setrow{display:grid;grid-template-columns:44px 1fr 1fr 1fr 34px;align-items:center;gap:6px}
.sethead{font-size:11px;color:var(--t3);padding:10px 10px 4px}
.setrow{background:var(--s1);border-radius:12px;padding:2px 10px;margin-bottom:6px;min-height:48px;border:1px solid transparent}
.setrow.sel{background:var(--s2);border-color:var(--ac)}
.setrow.warm{box-shadow:inset 3px 0 0 var(--am)}
.setrow.done .cell{color:var(--t2)}
.cell{font-size:19px;font-weight:600;padding:10px 0;font-variant-numeric:tabular-nums}
.cell.act{color:var(--ac2)!important}
.cell.zero{color:var(--t3)}
.lbl{font-size:14px;font-weight:700;padding:10px 0}
.last{font-size:13px;color:var(--t3);font-variant-numeric:tabular-nums}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--t3);display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--ok);border-color:var(--ok);color:#04342C}
.chk svg{width:16px;height:16px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:6px 16px 0}
.pad button{background:var(--s1);border-radius:11px;height:46px;font-size:22px;font-weight:500;text-align:center}
.acts,.wknav{display:flex;gap:8px;padding:8px 16px 0}
.acts .btn{padding:11px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;background:var(--s2);color:var(--am);font-variant-numeric:tabular-nums}
.pill.done{background:var(--ok);color:#04342C;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.ov{position:fixed;inset:0;z-index:50}
/* Food search is a normal page (not a floating panel): iOS handles the keyboard reliably for in-page inputs. */
.search-head{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:calc(var(--st) + 10px) 16px 10px}
/* Search panels: fixed height, header stays put, only the results scroll — typing never moves the search box. */
.sheet.full{top:calc(var(--st) + 6px);max-height:none;overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
.sheet.full .sbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin:0 -16px;padding:0 16px calc(var(--sb) + 18px)}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;background:#141416;border-radius:22px 22px 0 0;padding:10px 16px calc(var(--sb) + 18px);max-width:560px;margin:0 auto}
.ov.anim .bd{animation:fade .18s}
.ov.anim .sheet{animation:up .22s ease-out}
.ov.anim .sheet.full{animation:fade .18s}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet h3{margin:4px 0 14px;font-size:18px;text-align:center}
.big{font-size:62px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.1}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--s1);border-radius:12px;padding:12px;font-weight:600;text-align:center}
.chip.on{background:rgba(255,86,48,.22);color:var(--ac2)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border-radius:12px;padding:8px 8px 8px 14px}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper .ctl button{width:42px;height:38px;border-radius:10px;background:var(--s2);font-size:20px;text-align:center}
.stepper .val{min-width:62px;text-align:center;font-weight:700;color:var(--ac2)}
.plate{width:56px;height:56px;border-radius:12px;background:var(--ac);color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center}
.plates{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.chart{width:100%;height:auto}
.empty{text-align:center;padding:60px 24px;color:var(--t2)}
.empty .ic{font-size:40px;margin-bottom:10px}
.mv{display:flex;flex-direction:column;gap:3px;flex:none}
.mv button{width:32px;height:24px;border-radius:7px;background:var(--s2);font-size:11px;color:var(--t2);text-align:center}
.x{width:32px;height:32px;border-radius:16px;background:rgba(226,75,74,.15);color:#FF6B6B;font-size:15px;flex:none;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 96px);background:#2B2B30;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;animation:fade .2s;white-space:nowrap}
/* Barcode scanner: its own layer outside the app, so a re-render never touches the live camera. */
.scan{position:fixed;inset:0;z-index:60;background:#000;overflow:hidden}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .frame{position:absolute;left:8%;right:8%;top:38%;height:22%;border:3px solid var(--ac);border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.scan .frame::after{content:'';position:absolute;left:6%;right:6%;top:50%;height:2px;background:rgba(255,86,48,.75)}
.scan .top{position:relative;display:flex;align-items:center;padding:calc(var(--st) + 12px) 16px 0}
.scan .msg{position:absolute;left:16px;right:16px;bottom:calc(var(--sb) + 28px);text-align:center}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--s2);border-top-color:var(--ac);animation:rot .8s linear infinite;margin:0 auto}
@keyframes rot{to{transform:rotate(360deg)}}
.tools3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.ai-note{background:rgba(255,176,32,.12);color:var(--am);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.jump.cur{border:1px solid var(--ac)}
.seg{display:flex;background:var(--s1);border-radius:12px;padding:3px;margin:10px 0 12px}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:14px;font-weight:600;color:var(--t2);text-align:center}
.seg button.on{background:var(--s2);color:var(--t1)}
.chiprow{display:flex;gap:6px;margin-bottom:8px}
.chiprow.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px 8px;padding:0 16px}
.chiprow.scroll::-webkit-scrollbar{display:none}
.chiprow.wrap{flex-wrap:wrap}
.chip.sm{padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.key{display:inline-block;width:14px;height:3px;border-radius:2px;flex:none;vertical-align:middle}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card.mini{padding:12px;width:100%}
.chartwrap{position:relative;touch-action:pan-y}
.tip{position:absolute;top:2px;transform:translateX(-50%);background:#2B2B30;border-radius:8px;padding:5px 9px;font-size:12px;display:flex;gap:6px;white-space:nowrap;pointer-events:none}
.tip b{color:#fff}.tip span{color:var(--t2)}
.hbar{display:grid;grid-template-columns:84px 1fr 58px;align-items:center;gap:8px;padding:6px 0;width:100%}
.hn{font-size:13px;color:var(--t2)}
.hbar .track{position:relative;height:10px}
.hbar .zero{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:#383835}
.hbar .fill{position:absolute;top:0;bottom:0}
.hv{text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.vrow{display:grid;grid-template-columns:92px 1fr 78px;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.vtrack{position:relative;height:10px;background:rgba(255,255,255,.04);border-radius:3px}
.vband{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.13)}
.vfill{position:absolute;left:0;top:2px;bottom:2px;border-radius:0 3px 3px 0}
.st{font-size:12px;font-weight:600;text-align:right;white-space:nowrap}
.st.low{color:#fab219}.st.ok{color:#0ca30c}.st.high{color:#ec835a}
.lrow{padding:7px 0;border-bottom:1px solid var(--ln)}
.lrow:last-child{border-bottom:0}
.sec-h{margin:22px 4px 8px}
.coachnote{background:var(--s1);border-radius:12px;padding:9px 12px;margin-top:8px;font-size:13px;color:var(--t2)}
.coachnote b{color:var(--t1)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}
.tbl th{color:var(--t3);font-weight:500}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--t3);display:flex;align-items:center;justify-content:center;flex:none}
.check.on{background:var(--ok);border-color:var(--ok);color:#04342C}
.check svg{width:14px;height:14px}
.modebar{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(var(--st) + 6px) 16px 6px;background:rgba(14,14,16,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);display:flex;justify-content:center}
.seg.modeseg{margin:0;width:100%;max-width:320px}
.has-mode .scr{padding-top:calc(var(--st) + 68px)}
.nbar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.nbar>div{height:100%;border-radius:3px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.frow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 0;border-top:1px solid var(--ln)}
.frow:first-of-type{margin-top:8px}
.stack{display:flex;gap:2px;height:12px;margin:10px 0}
.card input,.card select{background:var(--s2)}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<input type="file" id="photo-file" accept="image/*" hidden>
<script>
(() => {
'use strict';

// ---------- constants & helpers ----------
const KEY = 'forge.v1';
const APP_VERSION = '1.9 · fist measurements';   // shown in Settings so you can confirm the phone has the latest upload
const EQ = { barbell: 'Barbell', dbSide: 'Dumbbell (per side)', dbTotal: 'Dumbbell (total)', machine: 'Machine', cable: 'Cable', bw: 'Bodyweight' };
const PLATES = [45, 35, 25, 10, 5, 2.5];
const uid = () => (crypto.randomUUID ? crypto.randomUUID().slice(0, 13) : Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtW = w => { const n = Math.round((+w || 0) * 100) / 100; return String(n); };
const fmtN = v => Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : String(Math.round(v * 10) / 10);
const fmtT = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const restLabel = s => s % 60 === 0 ? (s / 60) + ' min' : fmtT(s);
const reps = it => it.repMin === it.repMax ? String(it.repMin) : `${it.repMin}–${it.repMax}`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtDate = iso => new Date(iso).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const dayKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
const wUnit = eq => eq === 'dbSide' ? 'lb each' : 'lb';
const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

// ---------- muscles, coach data ----------
const MUSCLES = { chest: 'Chest', frontDelt: 'Front delts', sideDelt: 'Side delts', rearDelt: 'Rear delts', lats: 'Lats', upperBack: 'Upper back',
  traps: 'Traps', lowerBack: 'Lower back', biceps: 'Biceps', triceps: 'Triceps', forearms: 'Forearms', quads: 'Quads', hamstrings: 'Hamstrings',
  glutes: 'Glutes', adductors: 'Adductors', calves: 'Calves', core: 'Abs', obliques: 'Obliques', rotatorCuff: 'Rotator cuff' };
// Strength-chart groups. Colours are the validated categorical palette (dark
// steps) in its fixed order; a group's colour never changes when filtering.
const GROUPS = [
  { k: 'chest', name: 'Chest', color: '#3987e5', m: ['chest'] },
  { k: 'shoulders', name: 'Shoulders', color: '#d95926', m: ['frontDelt', 'sideDelt', 'rearDelt', 'rotatorCuff'] },
  { k: 'back', name: 'Back', color: '#199e70', m: ['lats', 'upperBack', 'traps', 'lowerBack'] },
  { k: 'arms', name: 'Arms', color: '#c98500', m: ['biceps', 'triceps', 'forearms'] },
  { k: 'quads', name: 'Quads', color: '#d55181', m: ['quads'] },
  { k: 'hamstrings', name: 'Hamstrings', color: '#008300', m: ['hamstrings'] },
  { k: 'glutes', name: 'Glutes', color: '#9085e9', m: ['glutes', 'adductors'] },
  { k: 'calves', name: 'Calves', color: '#e66767', m: ['calves'] }
];
const groupOf = m => GROUPS.find(g => g.m.includes(m)) || null;
const CH = { grid: '#2c2c2a', base: '#383835', muted: '#898781', surface: '#1B1B1E' };
const RANGES = [['1m', '1M', 30], ['3m', '3M', 91], ['6m', '6M', 182], ['all', 'All', null]];
const EFF = { easy: 'Easy', good: 'Good', hard: 'Hard' };
const PROBLEMS = [['neck', 'Neck'], ['shoulders', 'Shoulders'], ['lowerBack', 'Lower back'], ['kneesHips', 'Knees / hips']];
const defaultProfile = () => ({ name: '', priorities: [], problems: [] });
const defaultNutri = () => ({ profile: null, targets: null, auto: true, foods: {}, days: {}, recent: [] });
// Weekly hard-set target range per muscle (priority muscles get +3 on the low end).
const VOL = { chest: [10, 20], frontDelt: [4, 14], sideDelt: [8, 20], rearDelt: [6, 16], lats: [10, 20], upperBack: [10, 20], traps: [4, 14],
  lowerBack: [3, 10], biceps: [8, 16], triceps: [8, 16], forearms: [2, 10], quads: [10, 20], hamstrings: [8, 18], glutes: [8, 20],
  adductors: [3, 12], calves: [6, 16], core: [6, 16], obliques: [3, 10], rotatorCuff: [2, 8] };
// [main muscle, secondary muscles] for every exercise in the built-in routine.
const TAGS = {
  'Incline Dumbbell Press': ['chest', ['frontDelt', 'triceps']], 'Lateral Raise': ['sideDelt', []], 'Flat DB Press': ['chest', ['frontDelt', 'triceps']],
  'Seated Shoulder Press': ['frontDelt', ['sideDelt', 'triceps']], 'Cable Fly / Pec Deck': ['chest', []], 'Skullcrusher': ['triceps', []],
  'Triceps Pulldown': ['triceps', []], 'Lat Pulldown': ['lats', ['biceps', 'upperBack']], 'One-Arm Row': ['upperBack', ['lats', 'biceps', 'rearDelt']],
  'Deadlift': ['lowerBack', ['glutes', 'hamstrings', 'quads', 'traps', 'forearms']], 'CG Lat Pulldown': ['lats', ['biceps', 'upperBack']],

function migrate(d) {
  d.sessions = Array.isArray(d.sessions) ? d.sessions : [];
  d.active = d.active ?? null;
  d.days.forEach(day => {
    day.warmup = Array.isArray(day.warmup) ? day.warmup : [];
    day.items.forEach(it => { if (!('start' in it)) it.start = null; if (!('rest' in it)) it.rest = null; });
  });
  Object.values(d.exercises).forEach(ex => {
    if (!ex.prim) { const t = tagsFor(ex.name, ex.muscle); ex.prim = t.prim; ex.sec = t.sec; }
    if (!Array.isArray(ex.sec)) ex.sec = [];
  });
  d.profile = Object.assign(defaultProfile(), d.profile || {});   // fills new fields, keeps everything you set
  if (!('coachSeen' in d)) d.coachSeen = null;
  if (!Array.isArray(d.coachApplied)) d.coachApplied = [];
  d.nutri = Object.assign(defaultNutri(), d.nutri || {});
  if (d.mode !== 'nutri') d.mode = 'train';
  d.sessions.sort((a, b) => a.date < b.date ? -1 : 1);
  d.v = 1;
  return d;
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (d && d.exercises && Array.isArray(d.days)) return migrate(d); }
  } catch (e) { /* fall through to a fresh seed */ }
  const d = seed();
  d.welcome = true;   // brand-new install: ask for a name and how to start
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
  return d;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('Could not save — storage is full or blocked'); }
}

const getDay = id => db.days.find(d => d.id === id);
const exOf = id => db.exercises[id];
const curEntry = () => db.active ? db.active.entries[db.active.idx] : null;
const findSet = id => { const e = curEntry(); return e ? e.sets.find(s => s.id === id) : null; };

// Sets from the most recent finished session that included this exercise
// (matched by id, or by name so history survives a routine reset).
function lastSets(exId, dayId) {
  const h = exHistory(exId, dayId);
  return h.length ? h[0].sets : [];
}

function todayDay() {
  if (!db.days.length) return null;
  const last = db.sessions[db.sessions.length - 1];
  if (last) { const i = db.days.findIndex(d => d.id === last.dayId); if (i >= 0) return db.days[(i + 1) % db.days.length]; }
  return db.days[0];
}
function streak() {
  const set = new Set(db.sessions.map(s => dayKey(new Date(s.date))));
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (!set.has(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function weekCount() {
  const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return db.sessions.filter(s => new Date(s.date) >= d).length;
}

function render() {
  const keep = {};

  if (ui.resetWk) { delete keep.wk; ui.resetWk = false; }
  const sy = window.scrollY;
  if (ui.view.name === 'workout' && !db.active) { ui.view = { name: 'home' }; ui.tab = 'home'; ui.stack = []; }
  ui.charts = {};
  // The Training | Nutrition switch sits on top of every main (non-pushed) screen.
  const body = view(), root = ui.stack.length === 0 && ui.view.name !== 'workout';
  app.className = root ? 'has-mode' : '';
  const noTabs = ui.view.name === 'workout' || ui.view.name === 'fsearch';
  app.innerHTML = (root ? modeBar() : '') + body + (noTabs ? '' : tabbar()) + sheet();
  app.querySelectorAll('[data-keep]').forEach(el => { const k = el.dataset.keep; if (k in keep) el.scrollTop = keep[k]; });
  if (ui.resetScroll) { window.scrollTo(0, 0); ui.resetScroll = false; } else window.scrollTo(0, sy);
  if (ui.scrollSel) { ui.scrollSel = false; const el = app.querySelector('.setrow.sel'); if (el) el.scrollIntoView({ block: 'nearest' }); }
  document.body.style.overflow = (ui.sheet || ui.view.name === 'workout') ? 'hidden' : '';

}

// ---------- charts ----------
// Single-series line chart. `o.id` makes it interactive (crosshair + tooltip);
// `o.mini` is the small-multiple form; `o.domain` shares a y-scale across panels.
function lineChart(pts, color, o = {}) {
  const mini = !!o.mini;
  if (pts.length < 2) return `<div class="faint" style="text-align:center;padding:${mini ? 18 : 34}px 0;font-size:13px">${esc(o.empty || (pts.length ? 'Log this again to see a trend' : 'No data yet'))}</div>`;
  const W = 320, H = o.h || (mini ? 64 : 160), L = mini ? 4 : 6, R = mini ? 4 : 48, T = mini ? 8 : 12, B = mini ? 8 : 22;
  let x0 = Math.min(...pts.map(p => p.t)), x1 = Math.max(...pts.map(p => p.t));
  if (x1 === x0) { x0 -= 864e5; x1 += 864e5; }
  let y0, y1;
  if (o.domain) [y0, y1] = o.domain;
  else {
    const ys = pts.map(p => p.v).concat(o.zero ? [0] : [], o.ref != null ? [o.ref] : []);
    y0 = Math.min(...ys); y1 = Math.max(...ys);
    if (y1 === y0) { y0 -= 1; y1 += 1; }
    const pd = (y1 - y0) * 0.15; y0 -= pd; y1 += pd;
  }
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const fy = o.fmt || fmtN;
  const lab = `fill="${CH.muted}" font-size="10" font-family="-apple-system,system-ui,sans-serif"`;
  let g = '';
  // Gridline labels give way to the "Target" label when they'd overlap it.
  const refY = o.ref != null ? Y(o.ref) : null;
  if (!mini) for (const v of niceTicks(y0, y1)) {
    const y = Y(v).toFixed(1);
    if (refY != null && Math.abs(Y(v) - refY) < 12) { g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${CH.grid}"/>`; continue; }
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${o.zero && v === 0 ? CH.base : CH.grid}"/><text x="${W - R + 6}" y="${(+y + 3.5).toFixed(1)}" ${lab}>${fy(v)}</text>`;
  }
  else if (o.zero && y0 < 0 && y1 > 0) g += `<line x1="${L}" x2="${W - R}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="${CH.base}"/>`;
  if (o.ref != null && !mini) {
    const y = Y(o.ref).toFixed(1);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${CH.muted}" stroke-width="1.5"/><text x="${W - R + 6}" y="${(+y + 3.5).toFixed(1)}" ${lab}>Target</text>`;
  }
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const dotPts = !mini && pts.length <= 40 ? pts : [pts[pts.length - 1]];
  const dots = dotPts.map(p => `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4" fill="${color}" stroke="${CH.surface}" stroke-width="2"/>`).join('');
  const df = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const xl = mini ? '' : `<text x="${L}" y="${H - 5}" ${lab}>${df(x0)}</text><text x="${W - R}" y="${H - 5}" ${lab} text-anchor="end">${df(x1)}</text>`;
  const cross = o.id ? `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="${CH.muted}" visibility="hidden"/><circle class="xd" r="5" fill="${color}" stroke="${CH.surface}" stroke-width="2" visibility="hidden"/>` : '';
  if (o.id) ui.charts[o.id] = { pts, W, H, L, R, T, B, x0, x1, y0, y1, tip: o.tipFmt || fy };
  const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" ${o.id ? `data-chart="${o.id}"` : ''} role="img" aria-label="${esc(o.label || 'Trend chart')}">${g}<path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}${cross}</svg>`;
  return o.id ? `<div class="chartwrap">${svg}<div class="tip" hidden></div></div>` : svg;
}

// Gridline values at round steps (1, 2, 2.5, 5 × 10ⁿ) inside [lo, hi].
function niceTicks(lo, hi, n = 3) {
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag, out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(Math.abs(v) < 1e-9 ? 0 : +v.toFixed(6));
  return out;
}

function showTip(svg, clientX) {
  const c = ui.charts[svg.dataset.chart];
  if (!c) return;
  const r = svg.getBoundingClientRect(), sx = (clientX - r.left) / r.width * c.W;
  const X = t => c.L + (t - c.x0) / (c.x1 - c.x0) * (c.W - c.L - c.R), Y = v => c.T + (1 - (v - c.y0) / (c.y1 - c.y0)) * (c.H - c.T - c.B);
  let best = c.pts[0];
  for (const p of c.pts) if (Math.abs(X(p.t) - sx) < Math.abs(X(best.t) - sx)) best = p;
  const x = X(best.t), y = Y(best.v), xh = svg.querySelector('.xh'), xd = svg.querySelector('.xd');
  xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
  xd.setAttribute('cx', x); xd.setAttribute('cy', y); xd.setAttribute('visibility', 'visible');
  const tip = svg.parentElement.querySelector('.tip'), val = document.createElement('b'), when = document.createElement('span');
  val.textContent = c.tip(best.v);
  when.textContent = new Date(best.t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  tip.replaceChildren(val, when);
  tip.hidden = false;
  tip.style.left = clamp(x / c.W * r.width, 44, r.width - 44) + 'px';
}
function hideTips(except) {
  document.querySelectorAll('svg[data-chart]').forEach(svg => {
    if (svg === except) return;
    svg.querySelectorAll('.xh,.xd').forEach(el => el.setAttribute('visibility', 'hidden'));
    const tip = svg.parentElement.querySelector('.tip');
    if (tip) tip.hidden = true;
  });
}

const pctTxt = v => (v < 0 && Math.round(Math.abs(v) * 10) ? '−' : '+') + Math.round(Math.abs(v) * 10) / 10 + '%';
const pctAxis = v => Math.round(v) === 0 ? '0%' : (v < 0 ? '−' : '+') + Math.abs(Math.round(v)) + '%';
const WEEK = 6048e5;
function startOfWeek(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }

// Best estimated 1RM per logged session, per exercise, tagged with its strength group.
function exPoints() {
  const map = new Map();
  for (const s of db.sessions) {
    const t = new Date(s.date).getTime();
    for (const e of s.entries) {
      const ws = e.sets.filter(x => !x.warm && x.w > 0);
      if (!ws.length) continue;
      const ex = exOf(e.exId), prim = ex && ex.prim ? ex.prim : tagsFor(e.exName, '').prim, g = groupOf(prim);
      if (!g) continue;
      const key = ex ? ex.id : 'n:' + e.exName;
      if (!map.has(key)) map.set(key, { g: g.k, name: ex ? ex.name : e.exName, pts: [] });
      map.get(key).pts.push({ t, v: Math.max(...ws.map(x => x.w * (1 + x.r / 30))) });
    }
  }
  return map;
}

// Weekly strength index for one group, as % change from the window start.
// Each exercise contributes its BEST estimated 1RM per week (so a lighter day
// of the same lift doesn't read as lost strength), carried forward through
// weeks it wasn't trained. Chain-linked: each step averages the change of the
// exercises present in both steps, so a newly added exercise never drags the line.
function groupSeries(gk, from, P) {
  const exs = [...P.values()].filter(x => x.g === gk);
  if (!exs.length) return { pts: [], exs: [] };
  const now = Date.now(), first = Math.min(...exs.map(x => x.pts[0].t));
  const start = from == null ? first : Math.max(from, first);
  // Whole calendar weeks (Mon–Sun), so two sessions of the same lift in one
  // week are always compared together.
  const w0 = startOfWeek(start), ticks = [];
  for (let t = w0; t <= now; t += WEEK) ticks.push(t);
  const series = exs.map(x => {
    let carry = null;
    return ticks.map((t, i) => {
      const inWin = x.pts.filter(p => p.t >= t && p.t < t + WEEK);
      if (inWin.length) carry = Math.max(...inWin.map(p => p.v));
      else if (i === 0) { const before = x.pts.filter(p => p.t < t); if (before.length) carry = before[before.length - 1].v; }
      return carry;
    });
  });
  const pts = [];
  let idx = 1, prevI = -1;
  ticks.forEach((t, i) => {
    if (!series.some(s => s[i] != null)) return;
    if (prevI >= 0) {
      const rs = series.filter(s => s[i] != null && s[prevI] != null).map(s => s[i] / s[prevI]);
      if (rs.length) idx *= rs.reduce((a, b) => a + b, 0) / rs.length;
    }
    pts.push({ t, v: (idx - 1) * 100 });
    prevI = i;
  });
  const exsOut = exs.map((x, j) => {
    const s = series[j], base = s.find(v => v != null), last = s[s.length - 1];
    return { name: x.name, ch: base && last && x.pts.some(p => p.t >= start) ? (last / base - 1) * 100 : null };
  }).filter(x => x.ch != null);
  return { pts, exs: exsOut };
}

function chartCard(title, unit, pts, color, id) {
  const vals = pts.map(p => p.v), latest = vals[vals.length - 1], diff = latest - vals[0];
  return `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="muted" style="font-size:14px">${title}</div>
    <div style="font-weight:700">${fmtN(latest)} <span class="faint" style="font-size:12px;font-weight:400">${unit}</span></div></div>
    ${lineChart(pts, color, { id, tipFmt: v => `${fmtN(v)} ${unit}`, label: title })}
    ${pts.length > 1 ? `<div style="font-size:12px;margin-top:6px" class="${diff >= 0 ? 'okc' : 'muted'}">${diff >= 0 ? '+' : '−'}${fmtN(Math.abs(diff))} ${unit} since first session</div>` : ''}</div>`;
}

function vProgress() {
  const mode = ui.progMode || 'muscles';
  if (!db.sessions.length) return `<div class="scr"><h1 style="margin-top:8px">Progress</h1><div class="empty"><div class="ic">📈</div>
    <div style="font-weight:600;color:var(--t1)">Strength charts</div><div style="margin-top:6px">Your strength growth by muscle group appears here once you've finished a few sessions.</div></div></div>`;
  return `<div class="scr"><h1 style="margin-top:8px">Progress</h1>
    <div class="seg"><button class="${mode === 'muscles' ? 'on' : ''}" data-a="progMode" data-v="muscles">Muscle groups</button>
      <button class="${mode === 'exercises' ? 'on' : ''}" data-a="progMode" data-v="exercises">Exercises</button></div>
    ${mode === 'muscles' ? vMuscles() : vExercises()}</div>`;

function vMuscles() {
  const rk = ui.progRange || '3m', range = RANGES.find(r => r[0] === rk) || RANGES[1];
  const from = range[2] ? Date.now() - range[2] * 864e5 : null, sel = ui.progGroup || 'all', P = exPoints();
  const series = GROUPS.map(g => ({ g, ...groupSeries(g.k, from, P) }));
  const since = from ? new Date(from).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : 'you started';
  const latest = s => s.pts.length ? s.pts[s.pts.length - 1].v : null;
  const filters = `<div class="chiprow">${RANGES.map(r => `<button class="chip sm ${r[0] === rk ? 'on' : ''}" data-a="progRange" data-v="${r[0]}">${r[1]}</button>`).join('')}</div>
    <div class="chiprow scroll"><button class="chip sm ${sel === 'all' ? 'on' : ''}" data-a="progGroup" data-v="all">All</button>${GROUPS.map(g =>
      `<button class="chip sm ${sel === g.k ? 'on' : ''}" data-a="progGroup" data-v="${g.k}"><i class="key" style="background:${g.color}"></i>${g.name}</button>`).join('')}</div>`;

  if (sel === 'all') {
    const vals = series.flatMap(s => s.pts.map(p => p.v)).concat([0]);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (hi - lo < 4) { hi += 2; lo -= 2; }
    const pd = (hi - lo) * 0.12, domain = [lo - pd, hi + pd];
    const maxAbs = Math.max(5, ...series.map(s => Math.abs(latest(s) ?? 0)));
    const bars = series.map(s => {
      const v = s.pts.length > 1 ? latest(s) : null;
      let fill = '';
      if (v != null) {
        const w = Math.abs(v) / maxAbs * 50;
        fill = `<div class="fill" style="background:${s.g.color};${v >= 0 ? `left:50%;width:${w}%;border-radius:0 4px 4px 0` : `left:${50 - w}%;width:${w}%;border-radius:4px 0 0 4px`}"></div>`;
      }
      return `<button class="hbar" data-a="progGroup" data-v="${s.g.k}"><span class="hn">${s.g.name}</span><div class="track"><div class="zero"></div>${fill}</div>
        <span class="hv ${v == null ? 'faint' : ''}">${v == null ? '—' : pctTxt(v)}</span></button>`;
    }).join('');
    const minis = series.map(s => `<button class="card mini" data-a="progGroup" data-v="${s.g.k}">
      <div class="row" style="gap:8px;margin-bottom:4px"><i class="key" style="background:${s.g.color}"></i><span class="grow ell" style="font-weight:600;font-size:14px">${s.g.name}</span>
      <span style="font-size:13px;font-weight:600">${s.pts.length > 1 ? pctTxt(latest(s)) : ''}</span></div>
      ${lineChart(s.pts, s.g.color, { mini: true, domain, zero: true, empty: s.pts.length ? 'Needs another week' : 'No data yet' })}</button>`).join('');
    return `${filters}<div class="sub" style="margin:2px 4px 12px">Strength change since ${since}, from your estimated 1-rep maxes. Tap a group for detail.</div>
      <div class="card"><div class="muted" style="font-size:14px;margin-bottom:6px">Change over this period</div>${bars}</div>
      <div class="grid2" style="margin-top:10px">${minis}</div>`;
  }

  const s = series.find(x => x.g.k === sel) || series[0], g = s.g, v = s.pts.length > 1 ? latest(s) : null;
  const table = ui.progTable && s.pts.length ? `<table class="tbl" style="margin-top:10px"><tr><th>Week of</th><th style="text-align:right">Change</th></tr>${s.pts.map(p =>
    `<tr><td>${new Date(p.t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</td><td style="text-align:right">${pctTxt(p.v)}</td></tr>`).join('')}</table>` : '';
  const exList = s.exs.slice().sort((a, b) => b.ch - a.ch).map(x => `<div class="row" style="padding:6px 0"><span class="grow ell">${esc(x.name)}</span>
    <span style="font-weight:600;font-variant-numeric:tabular-nums">${pctTxt(x.ch)}</span></div>`).join('');
  return `${filters}<div class="card">
      <div class="row" style="gap:8px"><i class="key" style="background:${g.color}"></i><span class="grow" style="font-weight:600">${g.name}</span>
        ${s.pts.length > 1 ? `<button class="sub" data-a="progTable">${ui.progTable ? 'Hide table' : 'Table'}</button>` : ''}</div>
      <div style="margin:6px 0 12px"><span style="font-size:32px;font-weight:700">${v == null ? '—' : pctTxt(v)}</span> <span class="sub">since ${since}</span></div>
      ${lineChart(s.pts, g.color, { id: 'grp', h: 180, zero: true, fmt: pctAxis, tipFmt: pctTxt, label: `${g.name} strength change`,
        empty: s.pts.length ? 'Log another week to see a trend' : `No weighted ${g.name.toLowerCase()} exercises logged in this period` })}${table}</div>
    ${exList ? `<div class="cap" style="margin:18px 4px 8px">Exercises in this group</div><div class="card">${exList}</div>` : ''}
    <div class="faint" style="font-size:12px;margin:12px 4px">Each exercise is measured against itself (estimated 1-rep max) and the changes are averaged, so heavy and light lifts count equally. Bodyweight-only work isn't included.</div>`;
}

function vExercises() {
  const S = db.sessions, map = new Map();
  for (const s of S) {
    const t = new Date(s.date).getTime();
    for (const e of s.entries) {
      const ws = e.sets.filter(x => !x.warm);
      if (!ws.length) continue;
      const ex = exOf(e.exId), name = ex ? ex.name : e.exName;
      if (!map.has(name)) map.set(name, { prim: ex && ex.prim ? ex.prim : tagsFor(e.exName, '').prim, pts: [] });
      map.get(name).pts.push({ t, best: Math.max(...ws.map(x => x.w * (1 + x.r / 30))), vol: ws.reduce((a, x) => a + x.w * x.r, 0),
        reps: ws.reduce((a, x) => a + x.r, 0), top: Math.max(...ws.map(x => x.w)) });
    }
  }
  if (!map.size) return '<div class="empty">Log a few sets to see exercise charts.</div>';
  const names = [...map.keys()].sort((a, b) => a.localeCompare(b));
  let sel = ui.statsEx;
  if (!map.has(sel)) {
    const ls = S[S.length - 1];
    sel = ls.entries.map(e => exOf(e.exId)?.name || e.exName).find(n => map.has(n)) || names[0];
  }
  const { pts, prim } = map.get(sel), g = groupOf(prim), color = g ? g.color : '#FF8A3D', weighted = pts.some(p => p.top > 0);
  const mStart = new Date(); mStart.setDate(1); mStart.setHours(0, 0, 0, 0);
  const totalSets = S.reduce((a, s) => a + s.entries.reduce((b, e) => b + e.sets.filter(x => !x.warm).length, 0), 0);
  const charts = weighted
    ? chartCard('Estimated 1-rep max', 'lb', pts.map(p => ({ t: p.t, v: p.best })), color, 'e1') +
      chartCard('Top set weight', 'lb', pts.map(p => ({ t: p.t, v: p.top })), color, 'e2') +
      chartCard('Volume per session', 'lb', pts.map(p => ({ t: p.t, v: p.vol })), color, 'e3')
    : chartCard('Total reps per session', 'reps', pts.map(p => ({ t: p.t, v: p.reps })), color, 'e1');
  return `<div class="stats3" style="margin-bottom:14px">
      <div class="card metric"><div class="cap">Workouts</div><div class="v">${S.length}</div></div>
      <div class="card metric"><div class="cap">This month</div><div class="v">${S.filter(s => new Date(s.date) >= mStart).length}</div></div>
      <div class="card metric"><div class="cap">Sets</div><div class="v">${fmtN(totalSets)}</div></div></div>
    <select id="stats-ex" aria-label="Exercise">${names.map(n => `<option value="${esc(n)}" ${n === sel ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
    ${g ? `<div class="sub" style="margin:8px 4px 0"><i class="key" style="background:${g.color}"></i> ${esc(MUSCLES[prim])} · ${g.name}</div>` : ''}
    <div class="list" style="margin-top:12px">${charts}</div>`;
}

// ---------- coach ----------
const fmt1 = v => String(Math.round(v * 10) / 10);
const INC = eq => (eq === 'machine' || eq === 'cable') ? 10 : eq === 'bw' ? 0 : 5;
const wTxt = (w, eq) => `${fmtW(w)} lb${eq === 'dbSide' ? ' each' : ''}`;

// Logged entries for an exercise, newest first. When the exercise appears on
// several days (e.g. calf raises at 220 on Day 3 and 200 on Day 6), prefer the
// history from the same day so loads and rep ranges are like-for-like.
function exHistory(exId, dayId) {
  const nm = exOf(exId)?.name, all = [], same = [];
  for (let i = db.sessions.length - 1; i >= 0; i--) {
    const s = db.sessions[i], e = s.entries.find(x => x.exId === exId || (nm && x.exName === nm));
    if (!e) continue;
    all.push(e);
    if (dayId && s.dayId === dayId) same.push(e);
  }
  return same.length ? same : all;
}
// The weight used on most working sets (ties go to the heavier one).
function mainWeight(ws) {
  const c = new Map();
  ws.forEach(s => c.set(s.w, (c.get(s.w) || 0) + 1));
  let best = 0, n = -1;
  c.forEach((k, w) => { if (k > n || (k === n && w > best)) { best = w; n = k; } });
  return best;
}
const bestE1 = e => Math.max(0, ...e.sets.filter(s => !s.warm).map(s => s.w > 0 ? s.w * (1 + s.r / 30) : s.r));
function isStalled(h) {
  if (h.length < 4) return false;
  return Math.max(bestE1(h[0]), bestE1(h[1]), bestE1(h[2])) <= bestE1(h[3]) * 1.01;
}

// Double progression against the target rep range, adjusted by how hard it felt
// and by the gym's weight jumps (big machine/cable jumps need more reps first).
function recommend(exId, target, equip, dayId) {
  const h = exHistory(exId, dayId);
  if (!h.length) return null;
  const last = h[0], ws = last.sets.filter(s => !s.warm);
  if (!ws.length) return null;
  // Judge the last session against the rep range it was actually done with.
  const tgt = last.target || target;
  const reps = ws.map(s => s.r), top = tgt.repMax, bot = tgt.repMin, eff = last.effort;
  const got = `${reps.join(', ')}${eff ? ` (${EFF[eff]})` : ''}`;
  const w = mainWeight(ws), inc = INC(equip);
  const allTop = reps.every(r => r >= top), below = reps.filter(r => r < bot).length * 2 > reps.length;
  // A stall only means something for loaded lifts that haven't reached the top of their range.
  const stall = w > 0 && !allTop && isStalled(h);
  if (!w || !inc) {
    return allTop ? { weight: w, kind: 'up', stall, msg: `Got ${got} — top of the range. Add a little weight or slow the tempo.` }
      : { weight: w, kind: 'hold', stall, msg: `Got ${got} — aim for +1 rep per set.` };
  }
  if (allTop && eff !== 'hard' && (inc < 10 || eff === 'easy' || reps.some(r => r >= top + 2)))
    return { weight: w + inc, kind: 'up', stall, msg: `Got ${got} at ${wTxt(w, equip)} → go up to ${wTxt(w + inc, equip)}.` };
  if (allTop) return { weight: w, kind: 'hold', stall, msg: eff === 'hard'
    ? `Got ${got} — top of the range but Hard. Stay at ${wTxt(w, equip)} until it feels Good.`
    : `Got ${got} — beat ${top} by a rep or two before the ${inc} lb jump.` };
  if (below) {
    const p = h[1], pws = p ? p.sets.filter(s => !s.warm) : [];
    const twice = pws.length > 0 && mainWeight(pws) >= w && pws.filter(s => s.r < bot).length * 2 > pws.length;
    if (twice || (eff === 'hard' && reps.every(r => r < bot))) {
      let nw = Math.round(w * 0.9 / inc) * inc;
      if (nw >= w) nw = w - inc;
      if (nw > 0) return { weight: nw, kind: 'down', stall, msg: `Below ${bot} reps ${twice ? 'two sessions running' : 'and Hard'} → drop to ${wTxt(nw, equip)} and build back up.` };
    }
    return { weight: w, kind: 'hold', stall, msg: `Got ${got} — stay at ${wTxt(w, equip)} and work up to ${bot}+ reps.` };
  }
  return { weight: w, kind: 'hold', stall, msg: `Got ${got} at ${wTxt(w, equip)} → same weight, aim for +1 rep per set.` };
}
function coachFor(exId, target, equip, start, dayId) {
  const r = recommend(exId, target, equip, dayId);
  if (r) return r;
  return start ? { weight: start, kind: 'first', msg: `First time logging this — start at ${wTxt(start, equip)} and see where ${target.repMin}–${target.repMax} reps lands.` } : null;
}
function prefillSets(exId, n, coach, start, dayId) {
  const last = lastSets(exId, dayId).filter(s => !s.warm);
  return Array.from({ length: n }, (_, k) => {
    const L = last[k] || last[last.length - 1];
    return { id: uid(), w: coach && coach.weight ? coach.weight : L ? L.w : (start || 0), r: 0, warm: false, done: false };
  });
}

function bestDayFor(m) {
  const g = groupOf(m), core = m === 'core' || m === 'obliques';
  const hits = d => d.items.filter(it => {
    const ex = exOf(it.exId);
    if (!ex) return false;
    if (core) return ex.prim === 'core' || ['quads', 'hamstrings'].includes(groupOf(ex.prim)?.k);
    return !!g && g.m.includes(ex.prim);
  }).length;
  const pool = db.days.filter(d => hits(d) > 0);
  return (pool.length ? pool : db.days).slice().sort((a, b) => a.items.length - b.items.length)[0]?.id || null;
}

function pickDrills(vol, pat) {
  const out = new Map(), prob = db.profile.problems;
  const add = (tag, n, reason) => DRILLS.filter(d => d.tags.includes(tag) && !out.has(d.id)).slice(0, n).forEach(d => out.set(d.id, { d, reason }));
  if (prob.includes('neck')) add('neck', 5, 'For your neck tightness');
  if (prob.includes('shoulders')) add('press', 3, 'For your shoulders');
  if (prob.includes('lowerBack')) { add('hinge', 2, 'For your lower back'); add('core', 1, 'For your lower back'); }
  if (prob.includes('kneesHips')) add('squat', 3, 'For your knees / hips');
  if (pat.press >= 12) add('press', 2, 'Balances all your pressing');
  if (pat.hinge >= 3) add('hinge', 2, 'Supports deadlifts & RDLs');
  if (pat.squat >= 8) add('squat', 2, 'Supports squats & lunges');
  if (vol.obliques < VOL.obliques[0]) add('obliques', 1, 'Your obliques get little direct work');
  if (vol.core < VOL.core[0]) add('core', 1, 'Core stability');
  return [...out.values()].slice(0, 9);
}

function analyze() {
  const now = Date.now(), from = now - 28 * 864e5;
  const S = db.sessions.filter(s => new Date(s.date).getTime() >= from);
  const first = db.sessions.length ? new Date(db.sessions[0].date).getTime() : now;
  const daysLogged = Math.floor((now - first) / 864e5) + 1;
  const span = S.length ? Math.min(28, Math.max(7, (now - new Date(S[0].date).getTime()) / 864e5 + 1)) : 7;
  const weeks = span / 7;
  const vol = {}, pat = { press: 0, hinge: 0, squat: 0 };
  Object.keys(MUSCLES).forEach(k => { vol[k] = 0; });
  for (const s of S) for (const e of s.entries) {
    const ex = exOf(e.exId), tg = ex && ex.prim ? { prim: ex.prim, sec: ex.sec || [] } : tagsFor(e.exName, '');
    const n = e.sets.filter(x => !x.warm).length;
    if (!n || !tg.prim) continue;
    vol[tg.prim] += n;
    tg.sec.forEach(m => { if (m in vol) vol[m] += n / 2; });
    if (['chest', 'frontDelt', 'triceps'].includes(tg.prim)) pat.press += n;
    if (/deadlift|rdl|good morning/i.test(e.exName)) pat.hinge += n;
    if (tg.prim === 'quads') pat.squat += n;
  }
  for (const k in vol) vol[k] /= weeks;
  for (const k in pat) pat[k] /= weeks;

  const prio = new Set(db.profile.priorities);
  const rows = Object.keys(MUSCLES).map(k => {
    let [lo, hi] = VOL[k];
    const g = groupOf(k), p = !!g && prio.has(g.k) && lo >= 6;
    if (p) lo += 3;
    const v = vol[k];
    return { k, v, lo, hi, p, g, status: v < lo - 0.5 ? 'low' : v > hi + 2 ? 'high' : 'ok' };
  });

  const sum = ks => ks.reduce((a, k) => a + vol[k], 0);
  const balance = [
    { a: 'Pushing', b: 'pulling', av: sum(['chest', 'frontDelt', 'triceps']), bv: sum(['lats', 'upperBack', 'rearDelt', 'biceps']), lo: 0.67, hi: 1.25,
      hiTip: 'More pushing than pulling — extra pulling work protects your shoulders.', loTip: 'Pulling clearly outweighs pushing — fine unless your chest is lagging.' },
    { a: 'Front delts', b: 'rear delts', av: vol.frontDelt, bv: vol.rearDelt, lo: 0, hi: 2,
      hiTip: 'Front delts get far more work than rear delts — a common cause of rounded shoulders.', loTip: '' },
    { a: 'Quads', b: 'hamstrings', av: vol.quads, bv: vol.hamstrings, lo: 0.6, hi: 1.6,
      hiTip: 'Quads are well ahead of hamstrings — add hamstring work for knee health.', loTip: 'Hamstrings are well ahead of quads.' },
    { a: 'Biceps', b: 'triceps', av: vol.biceps, bv: vol.triceps, lo: 0.6, hi: 1.6,
      hiTip: 'Biceps get much more work than triceps.', loTip: 'Triceps get much more work than biceps.' }
  ].map(x => {
    const r = x.av / Math.max(x.bv, 0.1);
    return { ...x, r, status: x.av + x.bv < 2 ? 'na' : r > x.hi ? 'high' : r < x.lo ? 'low' : 'ok' };
  });

  const P = exPoints();
  const strength = GROUPS.map(g => { const s = groupSeries(g.k, from, P); return { g, v: s.pts.length > 1 ? s.pts[s.pts.length - 1].v : null }; });
  const sv = k => strength.find(x => x.g.k === k).v;
  const sNotes = [];
  [['chest', 'back', 'Keep rows and pulldowns heavy so your back keeps pace.'], ['quads', 'hamstrings', 'Push your RDLs and leg curls so hamstrings keep pace.']].forEach(([a, b, tip]) => {
    const x = sv(a), y = sv(b), na = GROUPS.find(g => g.k === a).name, nb = GROUPS.find(g => g.k === b).name;
    if (x != null && y != null && Math.abs(x - y) > 8) sNotes.push({ text: `${x > y ? na : nb} strength (${pctTxt(Math.max(x, y))}) is outpacing ${(x > y ? nb : na).toLowerCase()} (${pctTxt(Math.min(x, y))}).`, tip: x > y ? tip : '' });
  });

  const stalls = [], seen = new Set();
  db.days.forEach(d => d.items.forEach(it => {
    if (seen.has(it.exId)) return;
    seen.add(it.exId);
    const ex = exOf(it.exId), r = ex && recommend(it.exId, it, ex.equip, d.id);
    if (r && r.stall) stalls.push({ ex, d });
  }));

  const inRoutine = name => db.days.some(d => d.items.some(it => (exOf(it.exId)?.name || '').toLowerCase() === name.toLowerCase()));
  const recs = [];
  rows.filter(r => r.status === 'low' && r.lo >= 2).sort((a, b) => (b.p - a.p) || ((b.lo - b.v) - (a.lo - a.v))).forEach(r => {
    // Logged volume can't change until you train, so once a fix for this muscle
    // has been accepted, hold off re-suggesting for two weeks.
    const ap = db.coachApplied.find(a => a.muscle === r.k && now - new Date(a.at) < 14 * 864e5);
    if (ap) {
      recs.push({ key: ap.key, kind: 'done', title: ap.title, sub: ap.sub,
        why: `Added ${new Date(ap.at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}. The coach will re-check ${MUSCLES[r.k].toLowerCase()} after a couple of weeks of training with it.` });
      return;
    }
    const why = `${MUSCLES[r.k]}: ${fmt1(r.v)} sets/week, target ${r.lo}–${r.hi}${r.p ? ' (a priority for you)' : ''}.`;
    const items = [];
    db.days.forEach(d => d.items.forEach(it => { const ex = exOf(it.exId); if (ex && ex.prim === r.k) items.push({ d, it, ex }); }));
    if (items.length && r.lo - r.v <= 3.5) {
      const b = items.sort((x, y) => x.it.sets - y.it.sets)[0];
      recs.push({ key: 'set:' + b.it.id, kind: 'set', muscle: r.k, title: `Add a set to ${b.ex.name}`, sub: `${b.d.name} · ${b.it.sets} → ${b.it.sets + 1} sets`, why, dayId: b.d.id, itemId: b.it.id });
    } else {
      const c = CATALOG.find(c => c.prim === r.k && !inRoutine(c.name));
      if (c) {
        const dayId = bestDayFor(r.k);
        recs.push({ key: 'ex:' + c.name, kind: 'ex', muscle: r.k, title: `Add ${c.name}`, sub: `${c.sets} × ${c.rm[0]}–${c.rm[1]} · suggested for ${getDay(dayId)?.name || 'a day'}`, why, c, dayId });
      }
    }
  });
  rows.filter(r => r.status === 'high').forEach(r => recs.push({ key: 'hi:' + r.k, kind: 'note', title: `${MUSCLES[r.k]} volume is very high`, sub: '',
    why: `${fmt1(r.v)} sets/week vs. a ${r.hi}-set ceiling. If recovery suffers, trim a set or two.` }));
  const NS = nutriStats(from);
  if (NS.T && NS.logged >= 5) {
    if (NS.hitP / NS.logged < 0.6) recs.push({ key: 'n:p', kind: 'note', title: `Protein target hit on ${NS.hitP} of ${NS.logged} logged days`, sub: 'Nutrition',
      why: `You're averaging ${r0(NS.avgP)} g vs. ${NS.T.p} g. Spreading 35–45 g across four meals makes the target much easier to reach.` });
    if (NS.ratio < 0.9) recs.push({ key: 'n:k', kind: 'note', title: `Eating ${Math.round(NS.ratio * 100)}% of your calorie target`, sub: 'Nutrition',
      why: `Averaging ${fmtInt(NS.avgKcal)} kcal vs. ${fmtInt(NS.T.kcal)}. On a lean bulk, under-eating slows strength and muscle gain${stalls.length ? ' — and may be behind the stalls below' : ''}.` });
  }
  stalls.forEach(s => recs.push({ key: 'st:' + s.ex.id, kind: 'note', title: `${s.ex.name} has stalled`, sub: s.d.name,
    why: 'No progress in 3 sessions. Try one lighter week (about −10%), or switch the rep range for a few weeks.' }));

  return { S, from, daysLogged, ready: daysLogged >= 28, rows, balance, strength, sNotes, recs, drills: pickDrills(vol, pat), nutri: NS };
}

function vCoach() {
  if (!db.sessions.length) return `<div class="scr"><h1 style="margin-top:8px">Coach</h1><div class="empty"><div class="ic">🧠</div>
    <div style="font-weight:600;color:var(--t1)">Your coach is ready when you are</div>
    <div style="margin-top:6px">Log workouts to get weight calls after every session, and a full review once you have 4 weeks of data.</div></div></div>`;
  const A = analyze(), now = Date.now();
  ui.recs = A.recs;
  if (A.ready && (!db.coachSeen || now - new Date(db.coachSeen) > 28 * 864e5)) { db.coachSeen = new Date().toISOString(); save(); }
  const df = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  let h = `<div class="scr"><h1 style="margin-top:8px">Coach</h1><div class="sub">Review of ${df(A.from)} – ${df(now)} · ${A.S.length} workout${A.S.length === 1 ? '' : 's'}</div>`;
  if (!A.ready) {
    const left = 28 - A.daysLogged;
    h += `<div class="card" style="margin-top:14px"><div style="font-weight:600">Early look</div>
      <div class="muted" style="font-size:14px;margin:4px 0 10px">The full monthly review unlocks after 4 weeks of logging — ${left} day${left === 1 ? '' : 's'} to go. Treat the numbers below as preliminary.</div>
      <div class="vtrack"><div class="vfill" style="width:${Math.min(100, A.daysLogged / 28 * 100)}%;background:var(--ac);border-radius:3px"></div></div></div>`;
  }

  const calls = [];
  db.days.forEach(d => d.items.forEach(it => {
    const ex = exOf(it.exId);
    if (!ex) return;
    const r = recommend(it.exId, it, ex.equip, d.id);
    if (r && (r.kind !== 'hold' || r.stall)) calls.push({ ex, d, r });
  }));
  if (calls.length) h += `<div class="cap sec-h">Next-session weight calls</div><div class="card">${calls.slice(0, 12).map(c => `<div class="lrow">
    <div class="row"><span class="grow ell" style="font-weight:600">${esc(c.ex.name)}</span><span style="font-weight:700">${c.r.kind === 'up' ? '▲ ' : c.r.kind === 'down' ? '▼ ' : ''}${c.r.weight ? wTxt(c.r.weight, c.ex.equip) : c.r.kind === 'up' ? 'add load' : ''}</span></div>
    <div class="faint" style="font-size:12px">${esc(c.d.name)}</div>
    <div class="sub" style="font-size:13px">${esc(c.r.msg)}${c.r.stall ? ' Stalled for 3 sessions.' : ''}</div></div>`).join('')}</div>`;

  h += `<div class="cap sec-h">Recommendations</div>`;
  h += A.recs.length ? `<div class="list">${A.recs.slice(0, 8).map(r => {
    const btn = r.kind === 'set' || r.kind === 'ex'

// Mifflin–St Jeor × activity, adjusted for the goal. Protein 0.9 g/lb (1.0 on a cut),
// fat 25% of calories, carbs fill the rest, water ≈ 0.6 oz per lb.
function calcTargets(pr) {
  const kg = pr.weightLb * 0.4536, cm = (pr.heightFt * 12 + pr.heightIn) * 2.54;
  const bmr = 10 * kg + 6.25 * cm - 5 * pr.age + (pr.sex === 'female' ? -161 : 5);
  const tdee = bmr * +pr.activity, adj = (GOALS.find(g => g[0] === pr.goal) || GOALS[0])[2];
  const kcal = Math.round((tdee + adj) / 10) * 10, p = Math.round(pr.weightLb * (pr.goal === 'cut' ? 1 : 0.9));
  const f = Math.round(kcal * 0.25 / 9), c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
  return { kcal, p, c, f, water: Math.max(64, Math.round(pr.weightLb * 0.6 / 8) * 8), tdee: Math.round(tdee) };
}
function parseProfile(F) {
  const age = parseFloat(F.age), w = parseFloat(F.weightLb), ft = parseFloat(F.heightFt), inch = parseFloat(F.heightIn || 0);
  if (!(age >= 13 && age <= 100 && w >= 70 && w <= 500 && ft >= 3 && ft <= 8 && inch >= 0 && inch < 12)) return null;
  return { sex: F.sex, age, weightLb: w, heightFt: ft, heightIn: inch, activity: F.activity, goal: F.goal };
}

// Nutrition over the coach window, plus how weekly strength moved with weekly intake.
function nutriStats(from) {
  const T = N().targets, out = { T, logged: 0 };
  if (!T) return out;
  const days = [];
  for (let k = todayKey(new Date(from)); k <= todayKey(); k = shiftKey(k, 1)) if (peekDay(k).entries.length) days.push({ k, ...dayTotals(k) });
  out.logged = days.length;
  if (!days.length) return out;
  out.avgKcal = avgOf(days.map(x => x.kcal)); out.avgP = avgOf(days.map(x => x.p));
  out.hitP = days.filter(x => x.p >= T.p * 0.9).length; out.ratio = out.avgKcal / T.kcal;
  const wk = new Map();
  days.forEach(x => { const ws = startOfWeek(keyToDate(x.k).getTime()); if (!wk.has(ws)) wk.set(ws, []); wk.get(ws).push(x.kcal / T.kcal); });
  const P = exPoints(), sw = new Map();
  GROUPS.forEach(g => {
    const s = groupSeries(g.k, from, P).pts;
    for (let i = 1; i < s.length; i++) { const ws = startOfWeek(s[i].t); if (!sw.has(ws)) sw.set(ws, []); sw.get(ws).push(s[i].v - s[i - 1].v); }
  });
  out.weeks = [...wk.entries()].filter(([, r]) => r.length >= 3).sort((a, b) => a[0] - b[0])
    .map(([ws, r]) => ({ ws, ratio: avgOf(r), strength: sw.has(ws) ? avgOf(sw.get(ws)) : null }));
  const fed = out.weeks.filter(w => w.ratio >= 0.95 && w.strength != null), under = out.weeks.filter(w => w.ratio < 0.9 && w.strength != null);
  if (fed.length && under.length) {
    const a = avgOf(fed.map(w => w.strength)), b = avgOf(under.map(w => w.strength));
    if (a - b > 0.5) out.link = { a, b };
  }
  return out;
}

function plateCalc(total, bar) {
  if (total <= bar) return { per: [], left: 0, ach: bar };
  let rem = (total - bar) / 2, ach = 0;
  const per = [];
  for (const p of PLATES) {
    const c = Math.floor((rem + 1e-6) / p);
    if (c > 0) { per.push([p, c]); rem -= c * p; ach += c * p; }
  }
  return { per, left: Math.max(0, Math.round(rem * 100) / 100), ach: bar + ach * 2 };
}

// ---------- workout logic ----------
function selectFirst() {
  const e = curEntry();
  if (!e) { ui.sel = null; return; }
  const s = e.sets.find(x => !x.done) || e.sets[0];

// ---------- rest timer ----------
function restDefault() { const e = curEntry(); return (e && e.target.rest) || 120; }

}

let actx = null;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function beep() {
  try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) {}
  if (!actx) return;
  const t = actx.currentTime;
  [0, 0.28, 0.56].forEach(o => {
    const osc = actx.createOscillator(), g = actx.createGain();
    osc.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t + o);
    g.gain.exponentialRampToValueAtTime(0.35, t + o + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o + 0.2);
    osc.connect(g).connect(actx.destination);
    osc.start(t + o); osc.stop(t + o + 0.22);
  });
}
setInterval(() => {
  const r = db.active && db.active.rest;
  if (!r || r.end == null) return;
  const left = Math.ceil((r.end - Date.now()) / 1000);
  if (left <= 0) { r.end = null; r.left = 0; r.alarm = true; save(); beep(); render(); return; }
  document.querySelectorAll('.rest-time').forEach(el => { el.textContent = fmtT(left); });
}, 250);

let wakeLock = null;
async function syncWake() {
  const want = ui.view.name === 'workout' && document.visibilityState === 'visible';
  try {
    if (want && !wakeLock && navigator.wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); else syncWake(); });

async function exportData() {
  const name = `forge-backup-${new Date().toISOString().slice(0, 10)}.json`;
  db.lastBackup = new Date().toISOString(); save();
  const file = new File([JSON.stringify(db)], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Forge backup' }); render(); return; }
    catch (e) { if (e.name === 'AbortError') { render(); return; } }
  }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  render();
}

    if (!d || typeof d.exercises !== 'object' || !Array.isArray(d.days)) throw new Error('bad file');
    migrate(d);
    openSheet({ type: 'confirm', title: 'Restore this backup?', msg: `This replaces everything on this phone with the backup (${d.sessions.length} workouts, ${d.days.length} days).`,

  } catch (err) { toast("That file isn't a Forge backup"); }
});

    const e = curEntry();
    if (e && e.exId !== id) {
      const orig = e.subFor || exOf(e.exId)?.name || e.exName;
      e.exId = id; e.exName = ex.name; e.equip = ex.equip;
      e.subFor = orig === ex.name ? null : orig;
      // Fresh advice and weights for the new exercise, unless sets are already logged.
      if (!e.sets.some(s => s.done)) { e.coach = coachFor(id, e.target, ex.equip, null, db.active.dayId); e.sets = prefillSets(id, e.sets.length, e.coach, null, db.active.dayId); }
      else e.coach = null;

    }
  } else if (ctx.mode === 'add') {
    const d = getDay(ctx.dayId);
    const L = ctx.lib;   // library picks bring their own suggested sets & reps
    if (d) { d.items.push({ id: uid(), exId: id, sets: L ? L.sets : 3, repMin: L ? L.rm[0] : 8, repMax: L ? L.rm[1] : 12, rest: null, start: null }); toast(`Added ${ex.name}`); }
