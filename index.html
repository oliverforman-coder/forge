  // coach actions
  recSet: d => {
    const r = ui.recs.find(x => x.key === d.k), it = r && itemOf(r.dayId, r.itemId);
    if (!it) return;
    it.sets = Math.min(12, it.sets + 1);
    db.coachApplied.push({ muscle: r.muscle, key: r.key, title: r.title, sub: r.sub, at: new Date().toISOString() });
    save(); toast('Set added'); render();
  },
  recEx: d => { const r = ui.recs.find(x => x.key === d.k); if (r) openSheet({ type: 'daypick', title: `Add ${r.c.name} to…`, kind: 'ex', rec: r, suggested: r.dayId }); },
  drillAdd: d => { const dr = DRILLS.find(x => x.id === d.id); if (dr) openSheet({ type: 'daypick', title: `Add ${dr.name} to…`, kind: 'drill', drill: dr.id, all: true }); },
  dayPicked: d => {
    const s = ui.sheet, days = d.id === 'all' ? db.days : [getDay(d.id)].filter(Boolean);
    ui.sheet = null;
    if (s.kind === 'ex') {
      const r = s.rec;
      days.forEach(x => addCatalogExercise(r.c, x.id));
      db.coachApplied.push({ muscle: r.muscle, key: r.key, title: r.title, sub: days.map(x => x.name).join(', '), at: new Date().toISOString() });
      toast(`Added to ${days.map(x => x.name).join(', ')}`);
    }
    else if (s.kind === 'drill') {
      const dr = DRILLS.find(x => x.id === s.drill);
      days.forEach(x => { if (!x.warmup.some(w => w.drill === dr.id)) x.warmup.push({ id: uid(), drill: dr.id, name: dr.name, dose: dr.dose }); });
      toast('Added to warm-up');
    }
    save(); render();
  },
  prioTog: d => { const p = db.profile.priorities, i = p.indexOf(d.v); if (i >= 0) p.splice(i, 1); else p.push(d.v); save(); render(); },
  probTog: d => { const p = db.profile.problems, i = p.indexOf(d.v); if (i >= 0) p.splice(i, 1); else p.push(d.v); save(); render(); },
  secTog: d => { const f = ui.sheet.f, i = f.sec.indexOf(d.v); if (i >= 0) f.sec.splice(i, 1); else f.sec.push(d.v); render(); },
  // progress charts
  progMode: d => { ui.progMode = d.v; render(); },
  progGroup: d => { ui.progGroup = d.v; ui.progTable = false; ui.resetScroll = true; render(); },
  progRange: d => { ui.progRange = d.v; render(); },
  progTable: () => { ui.progTable = !ui.progTable; render(); },
  openProgress: () => { ui.progMode = 'muscles'; ui.progGroup = 'all'; tab('progress'); },
  // top-level switch
  mode: d => { if (ui.mode === d.v) return; ui.mode = d.v; db.mode = d.v; save(); tab(d.v === 'nutri' ? 'ntoday' : 'home'); },
  // nutrition: day log
  nDay: d => { const k = shiftKey(ui.nday || todayKey(), +d.d); if (k > todayKey()) return; ui.nday = k === todayKey() ? null : k; render(); },
  nDayToday: () => { ui.nday = null; render(); },
  nWater: d => { const day = nDay(ui.nday || todayKey()); day.water = Math.max(0, day.water + +d.v); save(); render(); },
  nAdd: d => {
    go({ name: 'fsearch', meal: d.m, day: ui.nday || todayKey(), q: '', off: [], offState: 'idle', offQ: '' });
    const el = document.getElementById('food-q');
    if (el) el.focus();   // same tap → keyboard opens on iPhone
  },
  nCopy: d => {
    const k = ui.nday || todayKey(), y = peekDay(shiftKey(k, -1)).entries.filter(e => e.meal === d.m), day = nDay(k);
    y.forEach(e => day.entries.push({ ...e, id: uid() }));
    save(); toast(`Copied ${y.length} item${y.length === 1 ? '' : 's'}`); render();
  },
  nEdit: d => {
    const k = ui.nday || todayKey(), e = peekDay(k).entries.find(x => x.id === d.id);
    if (!e) return;
    let f = foodById(e.foodId);
    if (!f) { // food was deleted — rebuild one from the logged numbers so the entry stays editable
      const k100 = 100 / (e.g || 1);
      f = { id: e.foodId, name: e.name, brand: e.brand, src: 'custom', n: { kcal: e.kcal * k100, p: e.p * k100, c: e.c * k100, f: e.f * k100 }, measures: [{ l: e.ml, g: e.mg }] };
    }
    let mi = f.measures.findIndex(m => m.l === e.ml);
    if (mi < 0) { f = { ...f, measures: [{ l: e.ml, g: e.mg }, ...f.measures] }; mi = 0; }
    openSheet({ type: 'fadd', food: f, meal: e.meal, day: k, mi, qty: String(e.qty), entryId: e.id });
  },
  nRange: d => { ui.nRange = d.v; render(); },
  // nutrition: picking and adding food
  fPick: d => {
    const s = ui.view, f = foodById(d.id) || ui.offCache[d.id];
    if (f) openSheet({ type: 'fadd', food: f, meal: s.meal, day: s.day, mi: 0, qty: f.measures[0].l === 'g' ? '100' : '1' });
  },
  fQty: d => {
    const s = ui.sheet, m = s.food.measures[s.mi], step = m.l === 'g' ? 10 : m.l === 'oz' ? 1 : 0.5;
    s.qty = String(Math.max(0, r1((parseFloat(s.qty) || 0) + step * +d.s)));
    render();
  },
  fUnit: d => { // keep the same amount of food when switching units
    const s = ui.sheet, old = s.food.measures[s.mi], nm = s.food.measures[+d.i], g = (parseFloat(s.qty) || 0) * old.g;
    s.mi = +d.i;
    s.qty = String(nm.l === 'g' ? Math.round(g) : (Math.round(g / nm.g * 4) / 4 || 1));
    render();
  },
  fMeal: d => { ui.sheet.meal = d.v; render(); },
  fSave: () => {
    const s = ui.sheet, f = s.food, m = f.measures[s.mi], qty = parseFloat(s.qty);
    if (!(qty > 0)) { toast('Enter an amount'); return; }
    const v = scale(f, qty, m), day = nDay(s.day);
    const e = { id: s.entryId || uid(), meal: s.meal, foodId: f.id, name: f.name, brand: f.brand || '', qty, ml: m.l, mg: m.g, g: v.g, kcal: v.kcal, p: v.p, c: v.c, f: v.f };
    const i = s.entryId ? day.entries.findIndex(x => x.id === s.entryId) : -1;
    if (i >= 0) day.entries[i] = e; else day.entries.push(e);
    if (f.src === 'off' && !N().foods[f.id]) N().foods[f.id] = f;   // keep online foods for offline use
    N().recent = [f.id, ...N().recent.filter(x => x !== f.id)].slice(0, 30);
    ui.sheet = null; save();
    if (ui.view.name === 'fsearch') back(); else render();   // added from search → back to the day
    if (i < 0) toast(`Added ${r0(v.kcal)} kcal`);
  },
  fDel: () => { const s = ui.sheet, day = nDay(s.day); day.entries = day.entries.filter(x => x.id !== s.entryId); ui.sheet = null; save(); render(); },
  // nutrition: custom & saved foods
  nCustom: () => { const s = ui.view; openSheet({ type: 'fcustom', f: { name: s.q || '', brand: '', serving: '1 serving', grams: '', kcal: '', p: '', c: '', fat: '' }, meal: s.meal, day: s.day }); },
  welcomeGo: d => {
    const el = document.getElementById('w-name');
    db.profile.name = el ? el.value.trim() : '';
    if (d.v === 'empty') { db.exercises = {}; db.days = []; }
    delete db.welcome; ui.sheet = null; save(); render();
    if (d.v === 'empty') tab('workouts');
  },
  nCustomCode: () => { const s = ui.sheet, v = ui.view; openSheet({ type: 'fcustom', code: s.code, f: { name: s.name || '', brand: s.brand || '', serving: '1 serving', grams: '', kcal: '', p: '', c: '', fat: '' }, meal: v.meal, day: v.day }); },
  // nutrition: barcode & photo
  nScan: () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('No camera available here'); return; }
    unlockAudio(); startScan();
  },
  scanClose: () => stopScan(),
  scanType: () => {
    stopScan();
    const el = document.getElementById('food-q');
    if (el) { el.value = ''; ui.view.q = ''; refreshFoodResults(); el.setAttribute('inputmode', 'numeric'); el.focus(); el.addEventListener('blur', () => el.removeAttribute('inputmode'), { once: true }); }
  },
  nBarcode: d => { toast('Looking up barcode…'); lookupBarcode(d.code); },
  nPhoto: () => {
    const v = ui.view, s = ui.sheet, retry = s && s.type === 'aierr' && ui.photoCtx, bc = s && s.type === 'bcmiss';
    // "Try another photo" keeps everything from the first try; a missing barcode is always a label.
    if (!retry) ui.photoCtx = { meal: v.meal, day: v.day, q: v.q || '', code: bc ? s.code : '', name: bc ? s.name : '', mode: bc ? 'label' : null };
    if (!aiKey()) { openSheet({ type: 'aikey' }); return; }
    if (ui.photoCtx.mode) shootPhoto(); else openSheet({ type: 'phkind' });
  },
  phLabel: () => { ui.photoCtx.mode = 'label'; ui.photoCtx.ing = ''; ui.photoCtx.fist = null; shootPhoto(); },
  phMeal: () => openSheet({ type: 'phmeal', f: { ing: ui.photoCtx.ing || '', fist: !!db.profile.fist } }),
  phFist: () => { ui.sheet.f.fist = !ui.sheet.f.fist; render(); },
  phShoot: () => {
    const s = ui.sheet;
    if (s.f.fist && !db.profile.fist) { openSheet({ type: 'fistsize', f: { w: '', l: '', h: '', unit: 'in' }, back: s }); return; }   // first use: measure once
    Object.assign(ui.photoCtx, { mode: 'meal', ing: (s.f.ing || '').trim(), fist: s.f.fist ? db.profile.fist : null });
    shootPhoto();
  },
  fistEdit: () => {
    const v = fistOf(db.profile.fist) || {}, f = { unit: 'in' };
    FIST_DIMS.forEach(([k]) => { f[k] = v[k] ? String(r1(v[k])) : ''; });
    openSheet({ type: 'fistsize', f });
  },
  fistUnit: d => {   // convert whatever is typed so far
    const f = ui.sheet.f;
    if (d.v !== f.unit) FIST_DIMS.forEach(([k]) => { const n = parseFloat(f[k]); if (n > 0) f[k] = String(d.v === 'cm' ? r1(n * 2.54) : r1(n / 2.54)); });
    f.unit = d.v; render();
  },
  fistPreset: d => {
    const f = ui.sheet.f, p = FIST_PRESETS[+d.i];
    FIST_DIMS.forEach(([k], i) => { f[k] = String(f.unit === 'cm' ? r1(p[i + 1] * 2.54) : p[i + 1]); });
    render();
  },
  fistSave: () => {
    const s = ui.sheet, cm = s.f.unit === 'cm', out = {};
    for (const [k, name, , [lo, hi]] of FIST_DIMS) {
      const raw = String(s.f[k] || '').trim();
      if (!raw) { if (k === 'w') { toast('Enter at least your knuckle width'); return; } continue; }
      const n = parseFloat(raw), inch = cm ? n / 2.54 : n;
      if (!(inch >= lo && inch <= hi)) { toast(`${name} should be ${cm ? `${r0(lo * 2.54)}–${r0(hi * 2.54)} cm` : `${lo}–${hi} in`}`); return; }
      out[k] = Math.round(inch * 100) / 100;
    }
    db.profile.fist = out; save();
    if (s.back) { s.back.f.fist = true; ui.sheet = s.back; } else ui.sheet = null;
    render(); toast(`Fist saved: ${fistShort(out)}`);
  },
  aiKeySave: (d, el) => {
    const inp = el.closest('.sheet, .card').querySelector('#ai-key'), k = (inp ? inp.value : '').trim();
    if (!/^sk-ant-\S{20,}$/.test(k)) { toast('That doesn’t look like an API key (sk-ant-…)'); return; }
    try { localStorage.setItem(AI_KEY, k); } catch (e) { toast('Couldn’t save the key'); return; }
    if (ui.sheet && ui.sheet.type === 'aikey') { if (ui.photoCtx && ui.photoCtx.mode) { ui.sheet = null; render(); shootPhoto(); } else openSheet({ type: 'phkind' }); }
    else { render(); toast('Key saved'); }
  },
  aiKeyDel: () => { try { localStorage.removeItem(AI_KEY); } catch (e) {} render(); toast('Key removed'); },
  nCustomNew: () => openSheet({ type: 'fcustom', f: { name: '', brand: '', serving: '1 serving', grams: '', kcal: '', p: '', c: '', fat: '' } }),
  fCustomSave: () => {
    const s = ui.sheet, F = s.f, name = (F.name || '').trim(), num = x => Math.max(0, parseFloat(x) || 0);
    if (!name) { toast('Give the food a name'); return; }
    // "1 bar" is stored as the unit "bar" so the log reads "2 bar", not "2 1 bar".
    const kcal = num(F.kcal), p = num(F.p), c = num(F.c), fat = num(F.fat), grams = num(F.grams), serving = (F.serving || '').trim().replace(/^(1|one|a)\s+/i, '') || 'serving';
    if (!kcal && !p && !c && !fat) { toast('Enter the nutrition per serving'); return; }
    const k = grams > 0 ? 100 / grams : 1, id = s.foodId || 'c:' + uid(), code = s.code || (s.foodId && N().foods[s.foodId] && N().foods[s.foodId].code);
    const food = { id, name, brand: (F.brand || '').trim(), src: 'custom', n: { kcal: kcal * k, p: p * k, c: c * k, f: fat * k },
      measures: grams > 0 ? [{ l: serving, g: grams }, { l: 'g', g: 1 }, { l: 'oz', g: 28.35 }] : [{ l: serving, g: 100 }],
      serv: { serving, grams: grams || null, kcal, p, c, fat }, ...(code ? { code } : {}) };
    N().foods[id] = food; save();
    if (s.meal) openSheet({ type: 'fadd', food, meal: s.meal, day: s.day, mi: 0, qty: '1' });
    else { ui.sheet = null; render(); toast('Food saved'); }
  },
  fMine: d => openSheet({ type: 'fmine', id: d.id }),
  fMineEdit: () => {
    const f = N().foods[ui.sheet.id], v = f.serv;
    openSheet({ type: 'fcustom', foodId: f.id, f: { name: f.name, brand: f.brand, serving: v.serving, grams: v.grams ?? '', kcal: v.kcal, p: v.p, c: v.c, fat: v.fat } });
  },
  fMineDel: () => { const id = ui.sheet.id; delete N().foods[id]; N().recent = N().recent.filter(x => x !== id); ui.sheet = null; save(); render(); toast('Removed — past log entries are kept'); },
  // nutrition: targets
  openTargets: () => {
    const pr = N().profile || {}, T = N().targets || {};
    ui.form = { sex: pr.sex || 'male', age: pr.age ?? '', weightLb: pr.weightLb ?? '', heightFt: pr.heightFt ?? '', heightIn: pr.heightIn ?? '', activity: pr.activity || '1.55',
      goal: pr.goal || 'leanBulk', manual: N().targets ? !N().auto : false, kcalM: T.kcal ?? '', pM: T.p ?? '', cM: T.c ?? '', fM: T.f ?? '', waterM: T.water ?? '' };
    go({ name: 'ntargets' });
  },
  fSet: d => { ui.form[d.k] = d.v; render(); },
  fManual: () => {
    const F = ui.form;
    F.manual = !F.manual;
    if (F.manual && !F.kcalM) { const pr = parseProfile(F); if (pr) { const c = calcTargets(pr); Object.assign(F, { kcalM: c.kcal, pM: c.p, cM: c.c, fM: c.f, waterM: c.water }); } }
    render();
  },
  saveTargets: () => {
    const F = ui.form, pr = parseProfile(F);
    if (!pr) { toast('Fill in your age, weight and height'); return; }
    let T;
    if (F.manual) {
      const n = x => Math.max(0, Math.round(parseFloat(x) || 0));
      T = { kcal: n(F.kcalM), p: n(F.pM), c: n(F.cM), f: n(F.fM), water: n(F.waterM) || 100 };
      if (T.kcal < 800 || !T.p) { toast('Check your calorie and protein numbers'); return; }
    } else { const c = calcTargets(pr); T = { kcal: c.kcal, p: c.p, c: c.c, f: c.f, water: c.water }; }
    N().profile = pr; N().targets = T; N().auto = !F.manual;
    save(); back(); toast('Targets saved');
  },
  // generic
  closeSheet: () => closeSheet(),
  ok: () => { const f = ui.sheet && ui.sheet.fn; ui.sheet = null; if (f) f(); render(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  // Typing in food search / amount updates in place so the keyboard stays up.
  if (t.id === 'food-q' && ui.view.name === 'fsearch') { ui.view.q = t.value; refreshFoodResults(); scheduleOff(); return; }
  if (t.id === 'f-qty' && ui.sheet && ui.sheet.type === 'fadd') {
    const s = ui.sheet, el = document.getElementById('f-prev');
    s.qty = t.value;
    if (el) el.innerHTML = prevHtml(scale(s.food, parseFloat(s.qty) || 0, s.food.measures[s.mi]), hasGrams(s.food));
    return;
  }
  if (t.id === 'mine-q') {
    const q = t.value.trim().toLowerCase();
    document.querySelectorAll('[data-mn]').forEach(el => { el.hidden = !!q && !el.dataset.mn.includes(q); });
    return;
  }
  if (t.dataset.fk) {
    ui.form[t.dataset.fk] = t.value;
    const box = document.getElementById('tgt-box');   // live-recalculate targets without re-rendering the form
    if (box && !ui.form.manual && ['age', 'weightLb', 'heightFt', 'heightIn', 'activity'].includes(t.dataset.fk)) box.innerHTML = targetsBox(ui.form);
    return;
  }
  if (t.id === 'pick-search') pickFilter();
  else if (t.dataset.k && ui.sheet && ui.sheet.f) ui.sheet.f[t.dataset.k] = t.value;
});
document.addEventListener('change', e => {
  if (e.target.id === 'stats-ex') { ui.statsEx = e.target.value; render(); }
  else if (e.target.id === 'p-name') { db.profile.name = e.target.value.trim(); save(); }
  else if (e.target.dataset.k && ui.sheet && ui.sheet.f) ui.sheet.f[e.target.dataset.k] = e.target.value;
});
let askedPersist = false;
document.addEventListener('pointerdown', () => {
  unlockAudio();
  if (!askedPersist && navigator.storage && navigator.storage.persist) {
    askedPersist = true;
    navigator.storage.persist().then(p => { ui.persisted = p; }).catch(() => {});
  }
}, { passive: true });

// Chart crosshair + tooltip: snaps to the nearest week; works with mouse and touch.
document.addEventListener('pointermove', e => { const svg = e.target.closest && e.target.closest('svg[data-chart]'); if (svg) { hideTips(svg); showTip(svg, e.clientX); } });
document.addEventListener('pointerdown', e => { const svg = e.target.closest && e.target.closest('svg[data-chart]'); hideTips(svg); if (svg) showTip(svg, e.clientX); });
document.addEventListener('pointerout', e => {
  const svg = e.target.closest && e.target.closest('svg[data-chart]');
  if (svg && e.pointerType === 'mouse' && !svg.contains(e.relatedTarget)) hideTips();
});

// Swipe left/right on the exercise area to change exercise.
let tx = null, ty = null;
document.addEventListener('touchstart', e => {
  if (!e.target.closest('#wk-scroll')) { tx = null; return; }
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (tx == null || !db.active || ui.view.name !== 'workout' || ui.sheet) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  tx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) setIdx(db.active.idx + (dx < 0 ? 1 : -1));
}, { passive: true });

if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p => { ui.persisted = p; }).catch(() => {});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (db.welcome) openSheet({ type: 'welcome' }); else render();
})();
</script>
</body>
</html>
